global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    # 쿼리 문자열에 이메일 등이 포함될 수 있어 경로만 기록한다.
    log-format "%ft %b/%s %ST %B %HM %HP"
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    retries 0

frontend web
    bind :80
    acl private_path path_reg -i ^/api/(internal|metrics)(/|$) ^/(internal|metrics)(/|$)
    http-request deny deny_status 403 if private_path
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    default_backend apps

backend apps
    balance roundrobin
    # DB 연결 후 적용하는 최종 설정. primary 장애도 분산 대상에서 제외한다.
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host spacecube
    http-check expect status 200
    server api1 192.168.0.214:80 check inter 2s fall 2 rise 2
    server api2 192.168.0.215:80 check inter 2s fall 2 rise 2

frontend observability
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
