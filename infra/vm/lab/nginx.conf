log_format spacecube escape=json '{"time":"$time_iso8601","server":"$hostname","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
server {
    listen 80 default_server;
    server_name _;
    root /var/www/spacecube;
    access_log /var/log/nginx/spacecube-access.log spacecube;
    add_header X-Spacecube-Node $hostname always;
    location ~ ^/api/(internal|metrics)(/|$) { return 403; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Spacecube-Node $hostname;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8080;
    location = /nginx_status { stub_status; }
}
