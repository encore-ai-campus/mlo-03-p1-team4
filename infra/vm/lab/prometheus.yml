global:
  scrape_interval: 15s
  evaluation_interval: 15s
# 11-09 최종 배치(docs/로컬_VM_구성.md 3절): gw .218, mongo .211. DB 지표는 db1·db2의 node(9100)·mysqld(9104) exporter.
# 대시보드는 job·server 이름표로 찾으므로 아래 labels 이름(gw, api1, db-primary, db-replica …)은 바꾸지 않는다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: nodes
    static_configs:
      - targets: ['192.168.0.218:9100']
        labels: {server: gw}
      - targets: ['192.168.0.214:9100']
        labels: {server: api1}
      - targets: ['192.168.0.215:9100']
        labels: {server: api2}
      - targets: ['192.168.0.217:9100']
        labels: {server: mon}
      - targets: ['192.168.0.212:9100']
        labels: {server: db-primary}
      - targets: ['192.168.0.213:9100']
        labels: {server: db-replica}
  - job_name: api
    static_configs:
      - targets: ['192.168.0.214:8000']
        labels: {server: api1}
      - targets: ['192.168.0.215:8000']
        labels: {server: api2}
  - job_name: haproxy
    static_configs:
      - targets: ['192.168.0.218:8404']
  - job_name: nginx
    static_configs:
      - targets: ['192.168.0.214:9113', '192.168.0.215:9113']
  - job_name: mariadb
    static_configs:
      - targets: ['192.168.0.212:9104']
        labels: {server: db-primary}
      - targets: ['192.168.0.213:9104']
        labels: {server: db-replica}
  - job_name: alloy
    static_configs:
      - targets: ['192.168.0.218:12345']
        labels: {server: gw}
      - targets: ['192.168.0.214:12345']
        labels: {server: api1}
      - targets: ['192.168.0.215:12345']
        labels: {server: api2}
      - targets: ['192.168.0.217:12345']
        labels: {server: mon}
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']
        labels: {server: mon}
