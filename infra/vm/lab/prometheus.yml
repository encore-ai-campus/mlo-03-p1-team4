global:
  scrape_interval: 15s
  evaluation_interval: 15s
# 메트릭은 Prometheus pull. Alloy는 로그를 Loki로 보내고 Alloy 자체 /metrics만 여기서 scrape한다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: nodes
    static_configs:
      - targets: ['192.168.0.211:9100']
        labels: {server: gw}
      - targets: ['192.168.0.214:9100']
        labels: {server: api1}
      - targets: ['192.168.0.215:9100']
        labels: {server: api2}
      - targets: ['192.168.0.217:9100']
        labels: {server: mon}
  - job_name: api
    static_configs:
      - targets: ['192.168.0.214:8000']
        labels: {server: api1}
      - targets: ['192.168.0.215:8000']
        labels: {server: api2}
  - job_name: haproxy
    static_configs:
      - targets: ['192.168.0.211:8404']
  - job_name: nginx
    static_configs:
      - targets: ['192.168.0.214:9113', '192.168.0.215:9113']
  - job_name: alloy
    static_configs:
      - targets: ['192.168.0.211:12345']
        labels: {server: gw}
      - targets: ['192.168.0.214:12345']
        labels: {server: api1}
      - targets: ['192.168.0.215:12345']
        labels: {server: api2}
      - targets: ['192.168.0.217:12345']
        labels: {server: mon}
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']
        labels: {server: mon}
