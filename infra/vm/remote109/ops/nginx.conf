log_format spacecube escape=json '{"time":"$time_iso8601","server":"$hostname","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
# #67(B) 반영: 앱 연결을 재사용한다(Uvicorn keep-alive 5초보다 짧게 끊음).
upstream spacecube_local_api {
    server 127.0.0.1:8000;
    keepalive 16;
    keepalive_timeout 4s;
}
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/spacecube;
    access_log /var/log/nginx/spacecube-access.log spacecube;
    add_header X-Spacecube-Node $hostname always;
    location ~ ^/api/(internal|metrics)(/|$) { return 403; }
    location /api/ {
        proxy_pass http://spacecube_local_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8001/health;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Spacecube-Node $hostname always;
    }
    # #67(B) 반영: 사진은 WebP MIME을 명시하고 7일 캐시, 없는 파일은 index.html 대신 404.
    location ~* ^/photos/.*\.webp$ {
        types { image/webp webp; }
        try_files $uri =404;
        expires 7d;
        add_header X-Spacecube-Node $hostname always;
    }
    location /photos/ { try_files $uri =404; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Spacecube-Node $hostname always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8080;
    server_tokens off;
    access_log off;
    location = /nginx_status { stub_status; }
}
