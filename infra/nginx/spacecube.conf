# #54 · api1·api2 공통 후보 설정 (http 블록 안에서 한 번만 include)
# 역할: gw HAProxy가 서버를 고르고, 각 VM의 Nginx는 정적 파일과 localhost FastAPI만 담당한다.
# 설치 위치: /etc/nginx/conf.d/spacecube.conf. frontend/dist를 /var/www/frontend에 복사한다.
# 이 파일은 실제 VM에 적용하지 않았다. 적용 전 기본 사이트 충돌 확인 후 sudo nginx -t를 실행한다.

# FastAPI 응답의 X-Request-Id로 앱 로그와 연결하고, 정적·프록시 오류는 Nginx ID를 쓴다.
map $upstream_http_x_request_id $spacecube_request_id {
    ""      $request_id;
    default $upstream_http_x_request_id;
}

# URI·검색어·IP·본문·헤더 원문을 기록하지 않는다.
log_format spacecube_json escape=json
    '{"time":"$time_iso8601","request_id":"$spacecube_request_id",'
    '"method":"$request_method","status":$status,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    charset utf-8;
    root /var/www/frontend;
    index index.html;

    access_log /var/log/nginx/spacecube_access.log spacecube_json;
    # 기본 오류 로그에는 원문 URI·검색어가 들어갈 수 있다. 오류는 위 JSON 로그로 관측한다.
    error_log /dev/null;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # VM 방화벽은 :80을 gw에서만 허용한다. 앱은 외부 요청 헤더를 직접 신뢰하지 않는다.
    # Authorization·X-Session-Id·X-Synthetic·X-Synthetic-Key는 기본 동작으로 그대로 전달된다.
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # 이 서버에는 로컬 FastAPI 한 곳만 있다. 다른 api VM으로 재전송하지 않는다.
    proxy_next_upstream off;
    proxy_cache off;
    # 앱의 400·401·404·409·503 JSON 응답을 정문 오류 페이지로 덮지 않는다.
    proxy_intercept_errors off;

    # HAProxy 차단을 우회해도 내부·metrics API가 공개되지 않게 다시 막는다.
    # 숨긴 경로는 프로젝트 공통 NOT_FOUND 응답으로 돌린다.
    location = /api/internal {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }
    location ^~ /api/internal/ {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }
    location = /api/metrics {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }
    location ^~ /api/metrics/ {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }

    location = /api {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }

    # 공개 listener로 상태 페이지를 내보내지 않는다.
    location = /stub_status {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }

    location /api/ {
        # URI 끝의 /가 /api/ 접두사를 제거한다. 예: /api/health → /health.
        # query string과 요청 헤더는 유지하며, 오류 응답은 FastAPI 본문 그대로 전달한다.
        proxy_pass http://127.0.0.1:8000/;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CCL 안내 페이지와 사진은 실제 파일만 제공한다. 없는 사진은 SPA로 넘기지 않는다.
    location /photos/ {
        try_files $uri =404;
    }
    location ~* ^/photos/.*\.webp$ {
        try_files $uri =404;
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}

# 각 VM의 nginx exporter가 http://127.0.0.1:8080/stub_status를 수집한다.
# 포트는 루프백에만 바인딩한다. FastAPI /metrics는 공개 Nginx 경로로 전달하지 않는다.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    access_log off;
    error_log /dev/null;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"찾는 내용이 없어요.","detail":null}';
    }
}
