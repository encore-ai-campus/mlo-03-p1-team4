global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    retries 0

frontend public_http
    bind :80
    log-format "method=%HM status=%ST duration_ms=%Tt backend=%b server=%s"
    acl internal_api path -i /api/internal
    acl internal_api path_beg -i /api/internal/
    acl private_metrics path -i /api/metrics
    acl private_metrics path_beg -i /api/metrics/
    http-request deny if internal_api or private_metrics
    default_backend app_servers

backend app_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    # 업무 Uvicorn --limit-concurrency 100보다 작게 유지한다.
    server api1 api1:80 maxconn 50 check inter 2s fall 2 rise 2
    server api2 api2:80 maxconn 50 check inter 2s fall 2 rise 2

frontend monitoring
    bind :8404
    # 실제 mon 주소는 render_config.py로 주입한다. 기본값은 외부 접근을 거절한다.
    acl allowed_monitor src 127.0.0.1
    http-request deny unless allowed_monitor
    acl prometheus path -i /metrics
    http-request use-service prometheus-exporter if prometheus
    stats enable
    stats uri /stats
    stats refresh 10s
