# F-65: 정상 SLOT_TAKEN이 대량 발생해도 5xx 경보를 희석하지 않는지 검사.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: 정상_슬롯_충돌만_있으면_경보_없음
    interval: 1m
    input_series:
      - series: 'http_requests_total{status="201",vm="api1"}'
        values: '0+10x12'
      - series: 'http_requests_total{status="409",vm="api1"}'
        values: '0+90x12'
      - series: 'reservation_total{result="conflict",vm="api1"}'
        values: '0+90x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: HttpServerErrorRateHigh
        exp_alerts: []
  - name: 서버_오류_10퍼센트면_경보
    interval: 1m
    input_series:
      - series: 'http_requests_total{status="201",vm="api1"}'
        values: '0+90x12'
      - series: 'http_requests_total{status="503",vm="api1"}'
        values: '0+10x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: HttpServerErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'FastAPI 5xx 오류율 5% 초과 (SLOT_TAKEN 분모 제외)'
  - name: 충돌이_90퍼센트여도_서버_오류가_남으면_경보
    interval: 1m
    input_series:
      - series: 'http_requests_total{status="201",vm="api1"}'
        values: '0+10x12'
      - series: 'http_requests_total{status="409",vm="api1"}'
        values: '0+90x12'
      - series: 'reservation_total{result="conflict",vm="api1"}'
        values: '0+90x12'
      - series: 'http_requests_total{status="503",vm="api1"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: HttpServerErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'FastAPI 5xx 오류율 5% 초과 (SLOT_TAKEN 분모 제외)'
