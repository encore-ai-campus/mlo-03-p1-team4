global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          vm: mon
  # VM IP는 /etc/hosts의 중앙 배포본에서 이름에 매핑한다.
  # 설치 주소가 바뀌어도 아래 scrape 대상에는 이름과 exporter 포트만 둔다.
  - job_name: node
    static_configs:
      - targets: ["gw:9100"]
        labels: { vm: gw }
      - targets: ["api1:9100"]
        labels: { vm: api1 }
      - targets: ["api2:9100"]
        labels: { vm: api2 }
      - targets: ["mon:9100"]
        labels: { vm: mon }
      - targets: ["db1:9100"]
        labels: { vm: db1 }
      - targets: ["db2:9100"]
        labels: { vm: db2 }
      - targets: ["mongo:9100"]
        labels: { vm: mongo }
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api1:8000"]
        labels: { vm: api1 }
      - targets: ["api2:8000"]
        labels: { vm: api2 }
  - job_name: haproxy
    static_configs:
      - targets: ["gw:8404"]
        labels: { vm: gw }
  - job_name: nginx
    static_configs:
      - targets: ["api1:9113"]
        labels: { vm: api1 }
      - targets: ["api2:9113"]
        labels: { vm: api2 }
  - job_name: mysql
    static_configs:
      - targets: ["db1:9104"]
        labels: { vm: db1 }
      - targets: ["db2:9104"]
        labels: { vm: db2 }
  # MongoDB exporter는 DB 담당 설치 후 UP이 정상이어야 한다.
  - job_name: mongodb
    static_configs:
      - targets: ["mongo:9216"]
        labels: { vm: mongo }
  - job_name: alloy
    static_configs:
      - targets: ["gw:12345"]
        labels: { vm: gw }
      - targets: ["api1:12345"]
        labels: { vm: api1 }
      - targets: ["api2:12345"]
        labels: { vm: api2 }
      - targets: ["mon:12345"]
        labels: { vm: mon }
      - targets: ["db1:12345"]
        labels: { vm: db1 }
      - targets: ["db2:12345"]
        labels: { vm: db2 }
      - targets: ["mongo:12345"]
        labels: { vm: mongo }
  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels: { vm: mon }
