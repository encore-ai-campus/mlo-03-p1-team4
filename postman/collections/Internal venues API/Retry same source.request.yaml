$kind: http-request
name: Retry same source
order: 4000
url: '{{base_url}}/internal/venues'
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-Internal-Key
    value: '{{internal_api_key}}'
body:
  type: json
  content: '{{venue_json}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const required = ['internal_api_key', 'venue_json', 'updated_venue_json', 'invalid_venue_json'];
      if (pm.environment.get('allow_internal_write') !== '1' || required.some(k => !pm.environment.get(k))) {
        console.warn('로컬 테스트 환경을 설정하지 않아 내부 쓰기 요청을 건너뜁니다.');
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Identical source retry returns 200', () => pm.response.to.have.status(200));
      pm.test('Retry returns the same venue and warning', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.all.keys('venue_id', 'ignored_facilities');
        pm.expect(String(body.venue_id)).to.equal(pm.environment.get('internal_venue_id'));
        pm.expect(body.ignored_facilities).to.deep.equal([pm.environment.get('ignored_facility')]);
      });
