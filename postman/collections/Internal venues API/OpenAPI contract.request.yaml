$kind: http-request
name: OpenAPI contract
order: 1000
url: '{{base_url}}/openapi.json'
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OpenAPI returns 200', () => pm.response.to.have.status(200));
      pm.test('F-61 declares status codes and internal header', () => {
        const operation = pm.response.json().paths['/internal/venues'].post;
        ['200', '201', '400', '401'].forEach(s => pm.expect(operation.responses).to.have.property(s));
        pm.expect(operation.parameters.some(p => p.name === 'X-Internal-Key' && p.required)).to.equal(true);
      });
